name: Scene and Reset gate
on: [pull_request, push]
jobs:
  scenes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        width: [320, 390, 1440]
        motion: [reduce, no-preference]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: node scripts/scene-gate.mjs
        env:
          WIDTHS: '[${{ matrix.width }}]'
          MOTIONS: '["${{ matrix.motion }}"]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenes-${{ matrix.width }}-${{ matrix.motion }}
          path: verification/gate/
